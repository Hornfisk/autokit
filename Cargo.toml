[workspace]
members = ["xtask"]

[package]
name = "autokit"
version = "0.4.2"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Sample-based drum machine plugin with spectral analysis"

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "autokit-standalone"
path = "src/main.rs"

[dependencies]
# Plugin framework
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug", features = ["assert_process_allocs", "standalone"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug" }

# Audio
symphonia = { version = "0.5", features = ["wav", "flac", "ogg", "vorbis", "pcm"] }
rubato = "0.16"

# Real-time safety
basedrop = "0.1"
rtrb = "0.3"
# assert_no_alloc provided by nih-plug's forked version — use nih_plug::util::permit_alloc

# IPC & concurrency
crossbeam-channel = "0.5"
parking_lot = "0.12"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# DSP analysis
realfft = "3"

# Utilities
rand = "0.9"
walkdir = "2"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
lto = "thin"
strip = "symbols"
