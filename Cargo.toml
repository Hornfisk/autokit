[workspace]
members = ["xtask"]

[package]
name = "autokit"
version = "0.5.5"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Sample-based drum machine plugin with spectral analysis"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "autokit-standalone"
path = "src/main.rs"

[features]
default = []
# Opt-in audio-thread alloc assertion. Enabled for tests / CI, disabled
# by default for release builds — a stray alloc should glitch one buffer,
# not panic the JACK callback and wedge the user's PipeWire graph.
strict-alloc-asserts = ["nih_plug/assert_process_allocs"]

[dependencies]
# Plugin framework
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug", features = ["standalone"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug" }

# Audio
symphonia = { version = "0.5", features = ["wav", "flac", "ogg", "vorbis", "pcm"] }
rubato = "0.16"

# Real-time safety
basedrop = "0.1"
rtrb = "0.3"
# assert_no_alloc provided by nih-plug's forked version — use nih_plug::util::permit_alloc

# IPC & concurrency
crossbeam-channel = "0.5"
parking_lot = "0.12"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# DSP analysis
realfft = "3"

# Utilities
rand = "0.9"
walkdir = "2"
rfd = "0.14"
# Used only by the standalone binary to auto-select a MIDI input port.
# Pin to the same major as nih-plug's vendored copy to share the compile.
midir = "0.9"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
lto = "thin"
strip = "symbols"
